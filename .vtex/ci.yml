version: 0.2
phases:
  install:
    commands:
      - echo Installing Packages...
      - cd node && yarn --frozen-lockfile && cd ..
      - cd react && yarn --frozen-lockfile && cd ..
      - echo Packages installed!
  pre_build:
    commands:
      - echo Running tests...
      - cd node && yarn test && cd ..
      - cd react && yarn test && cd ..
      - echo Lint and tests finished!
cache:
  paths:
    - 'node/node_modules/**/*'
    - 'react/node_modules/**/*'
