type Query {
  """
  Retrieves the authenticated shopper's cross cart OrderForm ID, or NULL.
  The shopper and sales channel are derived from the request; `userId`, `userType`
  and `salesChannel` are ignored and will be removed in the next major version.
  """
  getSavedCart(
    userId: String
    userType: String
    salesChannel: String
    nullOnEmpty: Boolean
  ): String @cacheControl(scope: PRIVATE, maxAge: ZERO)

  """
  Retrieve app settings
  """
  getAppSettings: CrossDeviceCartSettings
    @cacheControl(scope: PUBLIC, maxAge: SHORT)
}

type Mutation {
  """
  Stores the authenticated shopper's current OrderForm ID as their cross cart reference.
  Only orderForms owned by the shopper (or anonymous) are stored. `userId`, `userType`
  and `salesChannel` are ignored and will be removed in the next major version.
  """
  saveCurrentCart(
    userId: String
    userType: String
    salesChannel: String
    orderFormId: String
  ): String
  """
  Makes the browser use the authenticated shopper's own saved cart (merging the
  current cart's items into it for ADD/COMBINE). Only a saved cart owned by the
  shopper is adopted; an anonymous saved cart only contributes missing items to
  the current cart. Returns NULL when the request is refused.
  `userType` is ignored and will be removed in the next major version.
  """
  replaceCart(
    savedCart: String!
    currentCart: String!
    strategy: Strategy!
    userType: String
  ): OrderForm

  """
  Save app settings. Admin only.
  """
  saveAppSettings(settings: SaveSettings): Boolean
    @auth(productCode: "38", resourceCode: "topbar_visualizar")
}
