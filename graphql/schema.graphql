type Query {
  """
  Retrieves the caller's own cross cart OrderForm ID. The shopper is identified
  server-side from the store-user token; `userId` and `userType` are deprecated
  and ignored. Returns NULL if no valid reference is stored; on a transient
  lookup failure the reference is kept and a GraphQL error is returned.
  """
  getSavedCart(userId: String, nullOnEmpty: Boolean, userType: String): String
    @cacheControl(scope: PRIVATE, maxAge: ZERO)

  """
  Retrieve app settings
  """
  getAppSettings: CrossDeviceCartSettings
    @cacheControl(scope: PUBLIC, maxAge: SHORT)
}

type Mutation {
  """
  Stores an OrderForm ID as the caller's cross cart reference, only if the
  orderForm is anonymous or owned by the caller. `userId` and `userType` are
  deprecated and ignored.
  """
  saveCurrentCart(userId: String, orderFormId: String, userType: String): String
  """
  Adopts the caller's own saved cart (OWNED by the token identity and with
  items), merging the current cart into it according to the strategy. A saved
  cart that is foreign, identified-but-not-owned or from a call-center session
  is never adopted; an anonymous saved cart is never adopted either, only its
  missing items are added to the current cart. `userType` is deprecated and
  ignored.
  """
  replaceCart(
    savedCart: String!
    currentCart: String!
    strategy: Strategy!
    userType: String
  ): OrderForm

  """
  Save app settings (admin only)
  """
  saveAppSettings(settings: SaveSettings): Boolean
    @auth(productCode: "38", resourceCode: "topbar_visualizar")
}
